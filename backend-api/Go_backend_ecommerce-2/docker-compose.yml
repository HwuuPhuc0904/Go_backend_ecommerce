version: '3.8'

services:
  app:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dbname?sslmode=disable
    depends_on:
      - db
    volumes:
      - ./backend-api:/app

  db:
    build:
      context: ./deployments/docker/postgres
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbname
    volumes:
      - db_data:/var/lib/postgresql/data

  nginx:
    build:
      context: ./deployments/docker/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  db_data: